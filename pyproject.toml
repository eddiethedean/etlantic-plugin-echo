[project]
name = "etlantic-plugin-echo"
version = "0.22.0"
description = "Minimal out-of-monorepo dataframe plugin proving ETLantic Plugin SDK public APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "etlantic>=0.22,<0.23",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/etlantic-plugin-echo"
Documentation = "https://github.com/eddiethedean/etlantic/tree/main/docs/07_PLUGIN_SDK"
Repository = "https://github.com/eddiethedean/etlantic-plugin-echo"
Issues = "https://github.com/eddiethedean/etlantic-plugin-echo/issues"

[project.entry-points."etlantic.dataframe_plugins"]
echo = "etlantic_echo:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etlantic_echo"]

[tool.hatch.build.targets.wheel.force-include]
"src/etlantic_echo/etlantic-plugin-manifest.json" = "etlantic_echo/etlantic-plugin-manifest.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
